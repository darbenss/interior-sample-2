  outcomes:
    - value: 11 weeks
      label: to heritage consent, from a prior refusal
    - value: "18"
      label: compliant keys, business case intact
    - value: 6 to 12
      label: rooms with genuine daylight
    - value: 1930s
      label: courtyard restored to the original plan
  clientQuote:
    quote: The previous team fought the listing for nine months. Ruang Rasa spent a week asking what it actually protected, and the answer gave us the whole scheme.
    attribution: Operator, Menteng

closingStatement: Consent in eleven weeks, and a courtyard nobody knew was there.

ctaMessage: Hello Ruang Rasa, I saw the Jakarta Boutique Hotel project. I have a heritage property and would like to discuss what is possible.
