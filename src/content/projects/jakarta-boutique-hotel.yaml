title: Jakarta Boutique Hotel
category: hospitality
location: Menteng, Jakarta
year: 2022
featured: false
order: 60
summary: Eighteen rooms in a 1930s colonial villa, where the heritage listing that made the property valuable also made it nearly unusable.
coverImage: /src/assets/images/portfolio/project-03.jpg
coverAlt: Warm timber joinery lining the approach to the guest rooms, lit from within the shelving
materialLabel: TIMBER / MENTENG
facts:
  - label: Scope
    value: Full interior, 18 keys, public areas
  - label: Area
    value: 1,140 sqm
  - label: Duration
    value: 16 months
  - label: Listing
    value: Grade II heritage, facade and structure

problem:
  - Corridors 220mm below egress width
  - No compliant bathroom in any room
  - Twelve of eighteen keys without daylight

designApproach: >-
  Removing the unprotected 1960s light-well infill restored the 1930s
  courtyard, released three further keys and gave twelve rooms a window.
  Original terrazzo and the main stair stay exposed; new work is legibly new —
  rattan, lime plaster and blackened steel held clear of protected fabric.

