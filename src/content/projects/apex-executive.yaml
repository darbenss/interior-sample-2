title: Apex Executive
category: commercial
location: Jakarta, Indonesia
year: 2023
featured: true
order: 30
summary: A law firm partner floor, rebuilt around the discovery that its most valuable conversations had nowhere private enough to happen.
coverImage: /src/assets/images/portfolio/project-06.webp
coverAlt: A partner's office in walnut panelling, with monochrome artwork against a fluted charcoal feature wall
materialLabel: WALNUT / JAKARTA
facts:
  - label: Scope
    value: Partner floor, client suites, millwork
  - label: Area
    value: 620 sqm
  - label: Duration
    value: 9 months
  - label: Headcount
    value: 34

problem:
  - Two meeting rooms for thirty-four people
  - Daylight allocated by rank
  - Conversations carried between offices

designApproach: >-
  Partner offices moved inboard behind 45dB construction, independently
  ventilated and reached by a client route that never crosses the working
  floor. Walnut from the retained 2009 boardroom table sets the veneer for
  every new enclosure, and the perimeter glazing became shared desks and two
  informal lounges.

