title: Zenith Studio
category: commercial
location: Tokyo, Japan
year: 2024
featured: true
order: 50
summary: A photography studio where the light was the product, and the interior had spent a decade fighting it.
coverImage: /src/assets/images/portfolio/project-05.jpg
coverAlt: Shooting floor with a full-height dark marble wall and a polished screed underfoot
materialLabel: CONCRETE / TOKYO
facts:
  - label: Scope
    value: Interior architecture, lighting, material specification
  - label: Area
    value: 285 sqm
  - label: Duration
    value: 8 months

problem:
  - Amber cast from the oak floor
  - 3000K fighting 6500K north daylight
  - No neutral reference surface anywhere

designApproach: >-
  Every surface in the shooting volume was specified by spectrophotometer —
  honed concrete, neutral plaster and a seamless cyclorama held within 0.4
  delta-E. Warm timber and the original brick survive in circulation and the
  viewing area, screened from the floor so they cannot enter a frame.

