title: Nocturne Lounge
category: hospitality
location: Seminyak, Bali
year: 2024
featured: true
order: 20
summary: A cocktail bar that emptied by ten every night. The problem was never the drinks list — it was that the room gave nobody a reason to stay.
coverImage: /src/assets/images/portfolio/project-02.jpg
coverAlt: A table laid for two in near darkness, lit by a single candle against a deep olive wall
materialLabel: 2200K / SEMINYAK
facts:
  - label: Scope
    value: Full fit-out, lighting design, bespoke furniture
  - label: Area
    value: 210 sqm
  - label: Duration
    value: 7 months
  - label: Capacity
    value: 84 covers

problem:
  - 52-minute average dwell time
  - 78dB in a half-full room
  - Nowhere comfortable past the first drink

designApproach: >-
  A third of the floor became deep banquettes in undyed linen, wrapped in
  blackened steel and slatted timber rafts that absorb sound without reading as
  acoustic panels. Lighting dropped from a flat 320 lux to four circuits that
  fall to 2200K across the evening.

