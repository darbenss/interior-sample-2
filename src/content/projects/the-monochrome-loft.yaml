title: The Monochrome Loft
category: residential
location: Singapore
year: 2023
featured: true
order: 40
summary: A 96 sqm shophouse loft for a couple who worked from home in the same room and had started to resent it.
coverImage: /src/assets/images/portfolio/project-04.jpg
coverAlt: Arched plaster niches in graded whites, with a single upholstered chair below
materialLabel: LIME PLASTER / SINGAPORE
facts:
  - label: Scope
    value: Interior architecture, joinery, acoustic strategy
  - label: Area
    value: 96 sqm
  - label: Duration
    value: 6 months

problem:
  - 96 sqm holding two full-time desks
  - Reverberation of 1.4 seconds
  - No boundary between work and rest

designApproach: >-
  A 3.2m panel on a floor-mounted bearing pivots to divide the volume, then
  sits flush against the joinery wall and disappears. Lime plaster over a
  perforated substrate and a full-width curtain in undyed wool absorb sound
  while reading as white. The bed lifts into the joinery by day.

