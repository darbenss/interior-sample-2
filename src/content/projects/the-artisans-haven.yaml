title: The Artisan's Haven
category: residential
location: Ubud, Bali
year: 2024
featured: true
order: 10
summary: A compartmented 1990s villa reopened into a single daylit volume, without losing the privacy a family of five actually needs.
coverImage: /src/assets/images/portfolio/project-01.jpg
coverAlt: Living room with a low teak credenza, boucle seating and bare pendant lamps against lime-washed walls
materialLabel: TEAK / UBUD
facts:
  - label: Scope
    value: Full interior architecture and custom joinery
  - label: Area
    value: 340 sqm
  - label: Duration
    value: 11 months
  - label: Collaboration
    value: Three master woodworkers, Gianyar

problem:
  - 340 sqm cut into eleven rooms
  - Daylight died two metres from the glass
  - The kitchen faced a wall, not the family

designApproach: >-
  Load-bearing partitions gave way to a 4.2m teak joinery wall that stops 400mm
  short of the ceiling, so light and air carry over the top. Sliding slatted
  screens in Gianyar teak replace doors — drawn in the evening for privacy,
  retracted to run the living space uninterrupted to the garden wall.

