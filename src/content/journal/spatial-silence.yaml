title: Spatial Silence
category: architecture
publishedAt: 2024-09-05
featured: false
excerpt: Designing negative space as an active architectural element — how nothingness dictates the flow and feeling of a room.
coverImage: /src/assets/images/journal/journal-04.jpg
coverAlt: Turned timber vessels and a shallow plate on a bare table, held in low light
body: |-
  Circulation is usually treated as the space left over once the rooms have been arranged. Reversing that order changes a plan more than any material decision.

  A corridor is not merely a route. It is the interval between two experiences, and its proportions determine how the second one lands. A room entered from a compressed, low, narrow passage feels considerably larger than the same room entered from a generous hall. Compression and release is the oldest move in architecture and it survives every change in taste because it operates on the body rather than the eye.

  In practice this means designing the empty parts first. Where does someone pause. Where do two people pass. Where does the eye travel when nobody is doing anything at all. These questions produce plans that furniture then has to accommodate, rather than plans that are the residue of furniture.

  The test is simple and unforgiving: walk the space with nothing in it. If it is not already good, no amount of specification will rescue it.
