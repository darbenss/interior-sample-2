title: The Psychology of Warm Lighting
category: lighting
publishedAt: 2024-10-12
featured: false
excerpt: Examining how the spectrum of domestic illumination alters emotional resonance and architectural perception.
coverImage: /src/assets/images/journal/journal-02.jpg
coverAlt: Late sunlight raking across two turned timber vessels and the wall behind them
body: |-
  Most homes are lit at a single colour temperature, on a single circuit, at a single level. This is the lighting equivalent of a building with one room.

  Daylight moves across the day from roughly 2000K at sunrise to 6500K at midday and back down again. Human circadian response is calibrated to that movement, not to the 3000K constant that most residential specifications settle on. A house lit at one temperature is asking its occupants to ignore the time of day.

  The practical intervention is unglamorous: more circuits, lower outputs, warmer sources after dark. A living room wants at least four independently dimmable layers — ambient wash, task, accent, and something below knee height. The last of these is the one most often omitted and the one that does the most work, because light from below the eyeline reads as firelight and the body responds accordingly.

  We specify 2200K for anything that operates after nine in the evening. It looks wrong on a datasheet and correct in a room. The number that matters is not the one in the specification but the hour at which people voluntarily go to bed.
